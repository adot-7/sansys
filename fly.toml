app = "sansys-discharge"
primary_region = "bom"
kill_signal = "SIGINT"

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/summaries.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[mounts]]
  source = "data"
  destination = "/data"